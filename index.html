<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Opteno" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="description" content="Opteno - Dijital Sınav Yönetim Sistemi. Telefon kamerası ile optik form okuma, dinamik optik üretme, kurum ve sınıf yönetimi." />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Opteno - Dijital Sınav Yönetim Sistemi</title>
    <style>
      html, body {
        background-color: #020617;
        color: #f8fafc;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
    </style>
    <script>
      // Immediately purge outdated service worker caches to prevent white screen from stale HTML
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            if (names[i] === 'opticok-v1') {
              caches.delete(names[i]);
            }
          }
        });
      }

      // Recover automatically if browser fails to load old cached chunk
      window.addEventListener('error', function(e) {
        var msg = (e && e.message) ? e.message.toLowerCase() : '';
        if (msg.indexOf('loading chunk') !== -1 || msg.indexOf('dynamically imported') !== -1 || msg.indexOf('failed to fetch') !== -1) {
          if (!sessionStorage.getItem('reloaded_on_err')) {
            sessionStorage.setItem('reloaded_on_err', '1');
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                Promise.all(keys.map(function(k) { return caches.delete(k); })).then(function() {
                  window.location.reload(true);
                });
              });
            } else {
              window.location.reload(true);
            }
          }
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.update();
          }).catch(function(err) {
            console.log('SW Reg failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
