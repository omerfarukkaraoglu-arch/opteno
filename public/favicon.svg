<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="opt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="opt-check" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="opt-ring" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Modern App Squircle Background -->
  <rect width="128" height="128" rx="32" fill="url(#opt-bg)"/>
  
  <!-- Subtle Inner Light Bevel -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="30.5" stroke="white" stroke-width="1.5" stroke-opacity="0.25" fill="none"/>

  <g filter="url(#glow)">
    <!-- Outer Optical Aperture Arc (Letter O) -->
    <path d="M64 24 C41.9 24 24 41.9 24 64 C24 86.1 41.9 104 64 104 C81.5 104 96.3 92.7 101.6 77" 
          stroke="url(#opt-ring)" stroke-width="11" stroke-linecap="round" fill="none"/>
    
    <!-- Inner Lens Ring Arc -->
    <circle cx="64" cy="64" r="23" stroke="white" stroke-width="3.5" stroke-dasharray="6 4" stroke-opacity="0.45" fill="none"/>
    
    <!-- Dynamic Optical Checkmark -->
    <path d="M48 64 L60 76 L98 38" 
          stroke="url(#opt-check)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>